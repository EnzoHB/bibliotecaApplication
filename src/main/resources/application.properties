# Esse é o nome da aplicação, mas não aparece nos logs
spring.application.name=biblioteca
# Sempre quando você inicia a biblioteca, aparece um banner. Essa config desliga
spring.main.banner-mode=off
# TRACE < DEBUG < INFO < WARN < ERROR
logging.level.root=WARN
# Só o profile da execução
spring.profiles.active=jdbc
# Config do baanco
spring.datasource.url=jdbc:h2:file:./data/biblioteca
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always